<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>熄灯守夜 · 现代渐变风双端预览</title>
  <style>
    :root {
      --bar: rgba(11, 13, 30, 0.78);
      --line: rgba(255, 255, 255, 0.11);
      --ink: #FFFFFF;
      --ink-2: rgba(226, 232, 255, 0.75);
      --ink-3: rgba(196, 206, 242, 0.48);
      --grad-primary: linear-gradient(135deg, #7C3AED 0%, #C026D3 54%, #EC4899 100%);
      --grad-title: linear-gradient(135deg, #FFFFFF 0%, #E0E7FF 52%, #F0ABFC 100%);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(50% 45% at 15% 12%, rgba(124, 58, 237, 0.24) 0%, transparent 65%),
        radial-gradient(45% 45% at 88% 18%, rgba(217, 70, 239, 0.18) 0%, transparent 65%),
        radial-gradient(50% 45% at 55% 95%, rgba(6, 182, 212, 0.16) 0%, transparent 68%),
        linear-gradient(150deg, #050712 0%, #0D0B24 52%, #04060E 100%);
      color: var(--ink);
      font-family: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color-scheme: dark;
    }

    .topbar {
      height: 56px;
      padding: 0 24px;
      background: var(--bar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: inline-flex;
      filter: drop-shadow(0 4px 12px rgba(168, 85, 247, 0.45));
    }

    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
      background: var(--grad-title);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ink-3);
      margin-left: 6px;
    }

    .seg {
      display: inline-flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .seg button {
      border: none;
      background: transparent;
      color: var(--ink-2);
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .seg button.active {
      background: var(--grad-primary);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.38);
    }

    .ext-links {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }

    .ext-links a {
      text-decoration: none;
      color: var(--ink-2);
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.16s ease;
    }

    .ext-links a:hover {
      background: rgba(139, 92, 246, 0.22);
      border-color: rgba(196, 181, 253, 0.38);
      color: #FFFFFF;
    }

    .stage {
      height: calc(100vh - 56px);
      display: grid;
      grid-template-columns: 404px minmax(0, 1fr);
      gap: 24px;
      padding: 20px 26px 24px;
      max-width: 1560px;
      margin: 0 auto;
      align-items: stretch;
    }

    .stage.mode-mobile { grid-template-columns: 404px; justify-content: center; }
    .stage.mode-desktop { grid-template-columns: minmax(780px, 1080px); justify-content: center; }
    .stage.mode-mobile .pane-desktop { display: none; }
    .stage.mode-desktop .pane-mobile { display: none; }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 8px;
    }

    .pane-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-2);
      letter-spacing: 0.2px;
    }

    .pane-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-3);
      font-family: ui-monospace, Consolas, monospace;
    }

    .frame-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background: #080B1A;
    }

    .frame-phone {
      border-radius: 36px;
      border: 1px solid rgba(196, 181, 253, 0.24);
      box-shadow: 0 26px 64px rgba(2, 4, 16, 0.65), 0 0 42px rgba(139, 92, 246, 0.16);
      max-height: 820px;
    }

    .frame-desktop {
      border-radius: 20px;
      border: 1px solid rgba(196, 181, 253, 0.22);
      box-shadow: 0 26px 64px rgba(2, 4, 16, 0.62), 0 0 46px rgba(6, 182, 212, 0.12);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    @media (max-width: 1040px) {
      .stage { grid-template-columns: 1fr; height: auto; }
      .frame-phone { max-width: 404px; width: 100%; height: 780px; margin: 0 auto; }
      .frame-desktop { height: 700px; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <defs>
            <linearGradient id="l-brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8B5CF6"/>
              <stop offset="52%" stop-color="#C026D3"/>
              <stop offset="100%" stop-color="#06B6D4"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="12" fill="url(#l-brand-bg)"/>
          <path d="M26.2 22.8A9.4 9.4 0 1 1 17 11.4a7.4 7.4 0 0 0 9.2 11.4Z" fill="#FFFFFF"/>
          <path d="M27.6 10.6 28.4 13l2.4.8-2.4.8-.8 2.4-.8-2.4-2.4-.8 2.4-.8.8-2.4Z" fill="#FFFBEB"/>
        </svg>
      </span>
      <span class="brand-title">熄灯守夜</span>
      <span class="brand-sub">DormSleep · 现代渐变风双端联调</span>
    </div>

    <div class="seg" role="tablist" aria-label="预览布局">
      <button type="button" class="active" data-mode="split">双端并排</button>
      <button type="button" data-mode="mobile">仅手机端</button>
      <button type="button" data-mode="desktop">仅电脑端</button>
    </div>

    <div class="ext-links">
      <a href="/mobile/" target="_blank">独立手机窗口 ↗</a>
      <a href="/desktop/" target="_blank">独立电脑窗口 ↗</a>
    </div>
  </header>

  <main id="stage" class="stage">
    <section class="pane pane-mobile">
      <div class="pane-label">
        <span>Android 手机端</span>
        <span class="pane-tag">/mobile/</span>
      </div>
      <div class="frame-wrap frame-phone">
        <iframe src="/mobile/" title="Android 手机端"></iframe>
      </div>
    </section>

    <section class="pane pane-desktop">
      <div class="pane-label">
        <span>Windows 电脑端</span>
        <span class="pane-tag">/desktop/</span>
      </div>
      <div class="frame-wrap frame-desktop">
        <iframe src="/desktop/" title="Windows 电脑端"></iframe>
      </div>
    </section>
  </main>

  <script>
    const stage = document.getElementById('stage');
    document.querySelectorAll('.seg button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.seg button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        stage.className = 'stage' + (btn.dataset.mode === 'split' ? '' : ` mode-${btn.dataset.mode}`);
      });
    });
  </script>
</body>
</html>
